[project]
name = "urc-c2-web"
version = "0.1.0"
description = "Local browser command station for the CU URC C2 prototype"
requires-python = ">=3.12,<3.14"
dependencies = [
  "urc-video-protocol",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pillow>=10,<13",
  "pyserial>=3.5,<4",
  "httpx>=0.27,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.uv]
package = false

[tool.uv.sources]
urc-video-protocol = { path = "packages/video_protocol", editable = true }
