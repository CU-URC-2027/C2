[project]
name = "urc-video-pipeline-prototype"
version = "0.1.0"
description = "Synthetic video pipeline development harness; hardware adapters are explicit"
requires-python = ">=3.12,<3.14"
dependencies = ["urc-video-protocol", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=2,<3", "pillow>=10,<13"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
urc-video-protocol = { path = "../../packages/video_protocol", editable = true }
