name: Browser, NET5 and video prototype verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, browser-ui-port, c2-net5-recovery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install hidden-window test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb xauth g++
      - name: Install locked Python dependencies
        run: uv sync --frozen
      - name: Run browser, video prototype, desktop, ROS host and native guard checks
        run: xvfb-run -a uv run --frozen python scripts/verify.py
